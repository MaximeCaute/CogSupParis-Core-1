<!DOCTYPE html>
<!-- A1 · The minimal skeleton of a webpage -->
<html lang="en">
  <head>
    <!-- The HEAD describes the page: encoding, title, stylesheets, scripts -->
    <meta charset="utf-8">
    <title>My first page</title>
  </head>
  <body>
    <!-- The BODY holds everything that is displayed -->
    <h1>Bonjour le monde !</h1>
    <p>This is a paragraph. Press F12 and find me in the Inspector.</p>

    <!-- Demo: this div is invisible. Why? (Inspector → hover over it) -->
    <div id="my-square"></div>
  </body>
</html>
