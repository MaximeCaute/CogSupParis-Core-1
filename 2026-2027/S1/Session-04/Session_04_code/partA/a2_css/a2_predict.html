<!DOCTYPE html>
<!-- A2 · Predict, then run: what colour is each box? -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Predict the colours</title>
    <style>
      div {
        display: inline-block;
        width: 120px;
        height: 120px;
        margin: 10px;
        background-color: gray;
      }
      .warm {
        background-color: orange;
      }
      #special {
        background-color: royalblue;
      }
    </style>
  </head>
  <body>
    <div>1</div>
    <div class="warm">2</div>
    <div class="warm" id="special">3</div>
    <div class="warm" style="background-color: seagreen">4</div>
  </body>
</html>
